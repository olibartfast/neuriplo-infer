name: Install Linux Dependencies
description: Installs shared apt packages required by all CI jobs

inputs:
  install-grpc:
    description: Install the optional gRPC compiler and development packages
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install shared dependencies
      shell: bash
      env:
        INSTALL_GRPC: ${{ inputs.install-grpc }}
      run: |
        # Some hosted runners reach the Azure HTTP mirror at only ~40 KB/s,
        # exhausting job timeouts before compilation. Keep Ubuntu's signed
        # package indexes and versions, but use the official archive over HTTPS.
        for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
          if [[ -f "$source_file" ]]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source_file"
          fi
        done
        # Bound idle mirror connections; retry transient acquisition failures.
        apt_options=(-o Acquire::Retries=3
                     -o Acquire::http::Timeout=30
                     -o Acquire::https::Timeout=30)
        grpc_packages=()
        if [[ "$INSTALL_GRPC" == 'true' ]]; then
          grpc_packages=(protobuf-compiler protobuf-compiler-grpc
                         libprotobuf-dev libgrpc++-dev)
        fi
        sudo apt-get "${apt_options[@]}" update
        sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
          cmake build-essential git wget ninja-build ccache \
          libopencv-dev \
          libgoogle-glog-dev \
          libcurl4-openssl-dev \
          libgtest-dev \
          python3-jsonschema "${grpc_packages[@]}"
