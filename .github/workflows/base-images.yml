# Publishes the version-pinned TensorRT SDK base image (tensorrt-deps) to
# GHCR so the per-PR TensorRT CI job skips the multi-GB CUDA + SDK download
# and unpack. The CI job resolves the base with a pull-or-fallback step (see
# ci.yml); this workflow only builds and pushes. Its own layer cache lives in
# the registry, never in GHA, so base builds add no pressure to the 10 GB
# GHA cache budget.

name: SDK base images

'on':
  push:
    branches: [develop, master, 'release/**', 'feature/**']
    paths:
      - docker/Dockerfile.tensorrt
      - .github/workflows/base-images.yml
      - versions.env
  # Weekly cadence picks up upstream Ubuntu/CUDA security updates. Only fires
  # once this file reaches the default branch; the push trigger above is what
  # refreshes the base on develop in the meantime.
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tensorrt-deps:
    name: tensorrt-deps base image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fetch neuriplo versions.env
        uses: ./.github/actions/fetch-neuriplo-versions

      - name: Read TensorRT pin
        id: pin
        run: |
          set -euo pipefail
          ENV_FILE=build/_deps/neuriplo-src/versions.env
          VER="$(grep -E '^TENSORRT_VERSION=' "$ENV_FILE" | cut -d= -f2)"
          if [ -z "$VER" ]; then
            echo "TENSORRT_VERSION missing from $ENV_FILE" >&2
            exit 1
          fi
          CUDA_LINE="$(grep -E '^TENSORRT_CUDA_VERSION=' "$ENV_FILE" | cut -d= -f2)"
          if [ -z "$CUDA_LINE" ]; then
            CUDA_LINE="$(grep -E '^CUDA_VERSION=' "$ENV_FILE" | cut -d= -f2)"
          fi
          if [ -z "$CUDA_LINE" ]; then
            echo "Neither TENSORRT_CUDA_VERSION nor CUDA_VERSION found in $ENV_FILE" >&2
            exit 1
          fi
          echo "version=${VER}-cuda-${CUDA_LINE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build and push tensorrt-deps
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.tensorrt
          target: backend_dependencies
          push: true
          tags: ghcr.io/${{ github.repository }}/tensorrt-deps:${{ steps.pin.outputs.version }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/tensorrt-deps:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/tensorrt-deps:buildcache,mode=max
