# Keep backend builds in one matrix: a failed configuration cancels its siblings.
name: CI
'on':
  push:
    branches:
    - develop
    - feature/**
    paths-ignore:
    - '**.md'
    - docs/**
  pull_request:
    branches:
    - develop
    - master
    - feature/**
    paths-ignore:
    - '**.md'
    - docs/**
jobs:
  backend-builds:
    name: ${{ matrix.display }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: true
      matrix:
        include:
        - variant: build-opencv-dnn
          display: Build & Test (OPENCV_DNN)
          timeout: 30
        - variant: kserve-build-matrix
          display: KServe (http+grpc)
          timeout: 30
          label: http+grpc
          enable_kserve: 'ON'
          enable_grpc: 'ON'
          enable_local: 'ON'
          install_grpc: true
        - variant: kserve-build-matrix
          display: KServe (http-only)
          timeout: 30
          label: http-only
          enable_kserve: 'ON'
          enable_grpc: 'OFF'
          enable_local: 'ON'
          install_grpc: false
        - variant: kserve-build-matrix
          display: KServe (local-only)
          timeout: 30
          label: local-only
          enable_kserve: 'OFF'
          enable_grpc: 'OFF'
          enable_local: 'ON'
          install_grpc: false
        - variant: kserve-build-matrix
          display: KServe (kserve-only)
          timeout: 30
          label: kserve-only
          enable_kserve: 'ON'
          enable_grpc: 'OFF'
          enable_local: 'OFF'
          install_grpc: false
        - variant: build-onnxruntime
          display: Build (ONNX_RUNTIME)
          timeout: 360
        - variant: build-libtorch-cpu
          display: Build (LIBTORCH_CPU)
          timeout: 360
        - variant: build-libtensorflow
          display: Build (LIBTENSORFLOW)
          timeout: 360
        - variant: build-tensorrt
          display: Build (TENSORRT)
          timeout: 360
        - variant: build-openvino
          display: Build (OPENVINO)
          timeout: 360
    steps:
    - uses: actions/checkout@v4
      if: ${{ matrix.variant == 'build-opencv-dnn' }}
    - name: Install shared dependencies
      uses: ./.github/actions/install-linux-deps
      if: ${{ matrix.variant == 'build-opencv-dnn' }}
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: build-opencv-dnn-${{ runner.os }}
      if: ${{ matrix.variant == 'build-opencv-dnn' }}
    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-opencv-dnn-${{ hashFiles('CMakeLists.txt', 'app/CMakeLists.txt', 'versions.env') }}
        restore-keys: ${{ runner.os }}-opencv-dnn-
      if: ${{ matrix.variant == 'build-opencv-dnn' }}
    - name: Configure
      run: |
        cmake -B build -G Ninja \
          -DDEFAULT_BACKEND=OPENCV_DNN \
          -DENABLE_APP_TESTS=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      if: ${{ matrix.variant == 'build-opencv-dnn' }}
    - name: Test CI SDK version resolution
      run: python3 scripts/test_ci_sdk_versions.py
      if: ${{ matrix.variant == 'build-opencv-dnn' }}
    - name: Check model-type docs are in sync
      run: |
        python3 scripts/sync_supported_model_types.py \
          --neuriplo-tasks-readme build/_deps/neuriplo-tasks-src/README.md \
          --check
      if: ${{ matrix.variant == 'build-opencv-dnn' }}
    - name: Build
      run: cmake --build build --config Release --parallel $(nproc)
      if: ${{ matrix.variant == 'build-opencv-dnn' }}
    - name: Test
      working-directory: build
      run: ctest --output-on-failure
      if: ${{ matrix.variant == 'build-opencv-dnn' }}
    - uses: actions/checkout@v4
      if: ${{ matrix.variant == 'kserve-build-matrix' }}
    - name: Install shared dependencies
      uses: ./.github/actions/install-linux-deps
      with:
        install-grpc: ${{ matrix.install_grpc }}
      if: ${{ matrix.variant == 'kserve-build-matrix' }}
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: kserve-build-matrix-${{ matrix.label }}
      if: ${{ matrix.variant == 'kserve-build-matrix' }}
    - name: Configure
      run: |
        cmake -B build -G Ninja \
          -DDEFAULT_BACKEND=OPENCV_DNN \
          -DENABLE_APP_TESTS=ON \
          -DNEURIPLO_INFER_ENABLE_KSERVE=${{ matrix.enable_kserve }} \
          -DNEURIPLO_INFER_ENABLE_GRPC=${{ matrix.enable_grpc }} \
          -DNEURIPLO_INFER_ENABLE_LOCAL_BACKENDS=${{ matrix.enable_local }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee configure.log
      if: ${{ matrix.variant == 'kserve-build-matrix' }}
    - name: Assert gRPC KServe client was actually enabled
      shell: bash
      run: |
        if ! grep -q "neuriplo-kserve-client: gRPC transport enabled" configure.log; then
          echo "::error::gRPC requested but not detected; build would silently fall back to HTTP" >&2
          exit 1
        fi
      if: ${{ matrix.variant == 'kserve-build-matrix' && (matrix.install_grpc) }}
    - name: Build
      run: cmake --build build --config Release --parallel $(nproc)
      if: ${{ matrix.variant == 'kserve-build-matrix' }}
    - name: Test (KServe unit tests, skip docker e2e)
      working-directory: build
      run: ctest --output-on-failure -E docker
      if: ${{ matrix.variant == 'kserve-build-matrix' && (matrix.enable_local != 'OFF') }}
    - name: Assert KServe sources are absent in local-only build
      shell: bash
      run: |
        if find build -name 'Kserve*.cpp.o' | grep -q .; then
          echo "::error::KServe sources were compiled in a local-only build" >&2
          find build -name 'Kserve*.cpp.o'
          exit 1
        fi
      if: ${{ matrix.variant == 'kserve-build-matrix' && (matrix.enable_kserve == 'OFF') }}
    - name: Assert neuriplo was NOT fetched in kserve-only build
      shell: bash
      run: |
        if [ -d build/_deps/neuriplo-src ]; then
          echo "::error::neuriplo was fetched in a KServe-only build (LOCAL_BACKENDS=OFF)" >&2
          exit 1
        fi
      if: ${{ matrix.variant == 'kserve-build-matrix' && (matrix.enable_local == 'OFF') }}
    - uses: actions/checkout@v4
      if: ${{ matrix.variant == 'build-onnxruntime' }}
    - name: Install shared dependencies
      uses: ./.github/actions/install-linux-deps
      if: ${{ matrix.variant == 'build-onnxruntime' }}
    - name: Fetch neuriplo versions.env
      id: build_onnxruntime_sdk
      uses: ./.github/actions/fetch-neuriplo-versions
      if: ${{ matrix.variant == 'build-onnxruntime' }}
    - name: Select pinned ONNX Runtime SDK
      run: echo "ORT_VERSION=${{ steps.build_onnxruntime_sdk.outputs.onnxruntime_version }}" >> "$GITHUB_ENV"
      if: ${{ matrix.variant == 'build-onnxruntime' }}
    - name: Cache ONNX Runtime download
      uses: actions/cache@v4
      id: build_onnxruntime_cache_ort
      with:
        path: ~/onnxruntime-linux-x64-gpu-${{ env.ORT_VERSION }}
        key: onnxruntime-linux-x64-gpu-${{ env.ORT_VERSION }}
      if: ${{ matrix.variant == 'build-onnxruntime' }}
    - name: Download ONNX Runtime
      run: |
        wget -q https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-gpu-${ORT_VERSION}.tgz
        tar -xzf onnxruntime-linux-x64-gpu-${ORT_VERSION}.tgz -C ~
        rm onnxruntime-linux-x64-gpu-${ORT_VERSION}.tgz
      if: ${{ matrix.variant == 'build-onnxruntime' && (steps.build_onnxruntime_cache_ort.outputs.cache-hit != 'true') }}
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: build-onnxruntime-${{ runner.os }}
      if: ${{ matrix.variant == 'build-onnxruntime' }}
    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-onnxruntime-${{ env.ORT_VERSION }}-${{ hashFiles('CMakeLists.txt', 'app/CMakeLists.txt', 'versions.env')
          }}
        restore-keys: ${{ runner.os }}-onnxruntime-${{ env.ORT_VERSION }}-
      if: ${{ matrix.variant == 'build-onnxruntime' }}
    - name: Configure
      run: |
        cmake -B build -G Ninja \
          -DDEFAULT_BACKEND=ONNX_RUNTIME \
          -DORT_VERSION=${ORT_VERSION} \
          -DONNX_RUNTIME_DIR=$HOME/onnxruntime-linux-x64-gpu-${ORT_VERSION} \
          -DENABLE_APP_TESTS=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      if: ${{ matrix.variant == 'build-onnxruntime' }}
    - name: Build
      run: cmake --build build --config Release --parallel $(nproc)
      if: ${{ matrix.variant == 'build-onnxruntime' }}
    - uses: actions/checkout@v4
      if: ${{ matrix.variant == 'build-libtorch-cpu' }}
    - name: Install shared dependencies
      uses: ./.github/actions/install-linux-deps
      if: ${{ matrix.variant == 'build-libtorch-cpu' }}
    - name: Fetch neuriplo versions.env
      id: build_libtorch_cpu_sdk
      uses: ./.github/actions/fetch-neuriplo-versions
      if: ${{ matrix.variant == 'build-libtorch-cpu' }}
    - name: Select pinned LibTorch SDK
      run: echo "LIBTORCH_VERSION=${{ steps.build_libtorch_cpu_sdk.outputs.pytorch_version }}" >> "$GITHUB_ENV"
      if: ${{ matrix.variant == 'build-libtorch-cpu' }}
    - name: Cache LibTorch download
      uses: actions/cache@v4
      id: build_libtorch_cpu_cache_libtorch
      with:
        path: ~/libtorch
        key: libtorch-cpu-${{ env.LIBTORCH_VERSION }}
      if: ${{ matrix.variant == 'build-libtorch-cpu' }}
    - name: Download LibTorch CPU
      run: |
        wget -q "https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-${LIBTORCH_VERSION}%2Bcpu.zip" \
          -O libtorch.zip
        unzip -q libtorch.zip -d ~
        rm libtorch.zip
      if: ${{ matrix.variant == 'build-libtorch-cpu' && (steps.build_libtorch_cpu_cache_libtorch.outputs.cache-hit != 'true')
        }}
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: build-libtorch-cpu-${{ runner.os }}
      if: ${{ matrix.variant == 'build-libtorch-cpu' }}
    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-libtorch-cpu-${{ env.LIBTORCH_VERSION }}-${{ hashFiles('CMakeLists.txt', 'app/CMakeLists.txt',
          'versions.env') }}
        restore-keys: ${{ runner.os }}-libtorch-cpu-${{ env.LIBTORCH_VERSION }}-
      if: ${{ matrix.variant == 'build-libtorch-cpu' }}
    - name: Configure
      run: |
        cmake -B build -G Ninja \
          -DDEFAULT_BACKEND=LIBTORCH \
          -DCMAKE_PREFIX_PATH=$HOME/libtorch \
          -DLIBTORCH_DIR=$HOME/libtorch \
          -DENABLE_APP_TESTS=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      if: ${{ matrix.variant == 'build-libtorch-cpu' }}
    - name: Build
      run: cmake --build build --config Release --parallel $(nproc)
      if: ${{ matrix.variant == 'build-libtorch-cpu' }}
    - uses: actions/checkout@v4
      if: ${{ matrix.variant == 'build-libtensorflow' }}
    - name: Fetch neuriplo versions.env
      uses: ./.github/actions/fetch-neuriplo-versions
      if: ${{ matrix.variant == 'build-libtensorflow' }}
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker system prune -af
      if: ${{ matrix.variant == 'build-libtensorflow' }}
    - uses: docker/setup-buildx-action@v3
      if: ${{ matrix.variant == 'build-libtensorflow' }}
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.libtensorflow
        push: false
        tags: neuriplo-infer:libtensorflow
        cache-from: type=gha
        cache-to: type=gha,mode=max
      if: ${{ matrix.variant == 'build-libtensorflow' }}
    - uses: actions/checkout@v4
      if: ${{ matrix.variant == 'build-tensorrt' }}
    - name: Fetch neuriplo versions.env
      uses: ./.github/actions/fetch-neuriplo-versions
      if: ${{ matrix.variant == 'build-tensorrt' }}
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker system prune -af
      if: ${{ matrix.variant == 'build-tensorrt' }}
    - uses: docker/setup-buildx-action@v3
      if: ${{ matrix.variant == 'build-tensorrt' }}
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.tensorrt
        push: false
        tags: neuriplo-infer:tensorrt
        cache-from: type=gha
        cache-to: type=gha,mode=max
      if: ${{ matrix.variant == 'build-tensorrt' }}
    - uses: actions/checkout@v4
      if: ${{ matrix.variant == 'build-openvino' }}
    - name: Fetch neuriplo versions.env
      id: build_openvino_sdk
      uses: ./.github/actions/fetch-neuriplo-versions
      if: ${{ matrix.variant == 'build-openvino' }}
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker system prune -af
      if: ${{ matrix.variant == 'build-openvino' }}
    - uses: docker/setup-buildx-action@v3
      if: ${{ matrix.variant == 'build-openvino' }}
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.openvino
        build-args: OPENVINO_VERSION=${{ steps.build_openvino_sdk.outputs.openvino_version }}
        push: false
        tags: neuriplo-infer:openvino
        cache-from: type=gha
        cache-to: type=gha,mode=max
      if: ${{ matrix.variant == 'build-openvino' }}
