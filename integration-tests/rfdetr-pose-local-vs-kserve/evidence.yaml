# These checks require GPU and C++ tooling and are NOT executed by platform
# metadata CI. They are attested by the release maintainer (or owning-repo CI)
# and committed here. scripts/generate_compat_report.py validates this file and
# renders it into reports/latest.md; platform CI validates the attestation, it
# does not re-run the underlying build/test.
#
# Per-check schema:
#   status: pass | fail | skipped | not_attested
#   detail: short human-readable description of what was run
#   source: optional pointer to the runbook, command, or CI log
#
# status values:
#   pass          attested as succeeding for this pinned set
#   fail          attested as failing; blocks the set until documented or reverted
#   skipped       intentionally not run for this set (document why in detail)
#   not_attested  no attestation recorded yet (reported, not blocking)

